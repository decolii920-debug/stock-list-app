<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 종목 리스트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
  }
  .container {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
    width: 100%;
    max-width: 520px;
    overflow: hidden;
  }
  header {
    background: #1f2937;
    color: #fff;
    padding: 24px;
    text-align: center;
  }
  header h1 { font-size: 22px; font-weight: 600; }
  header p { font-size: 13px; opacity: 0.7; margin-top: 4px; }
  .input-area {
    display: flex;
    gap: 8px;
    padding: 20px;
    border-bottom: 1px solid #e5e7eb;
  }
  #stockInput {
    flex: 1;
    padding: 12px 14px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.15s;
  }
  #stockInput:focus { border-color: #667eea; }
  #addBtn {
    background: #667eea;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 0 20px;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  #addBtn:hover { background: #5567d8; }
  .stats {
    padding: 12px 20px;
    background: #f9fafb;
    font-size: 13px;
    color: #6b7280;
    display: flex;
    justify-content: space-between;
  }
  ul#stockList {
    list-style: none;
    max-height: 60vh;
    overflow-y: auto;
  }
  ul#stockList li {
    display: flex;
    align-items: center;
    padding: 14px 20px;
    border-bottom: 1px solid #f3f4f6;
    transition: background 0.1s;
  }
  ul#stockList li:hover { background: #f9fafb; }
  ul#stockList li:last-child { border-bottom: none; }
  .checkbox {
    width: 20px;
    height: 20px;
    margin-right: 14px;
    cursor: pointer;
    accent-color: #667eea;
  }
  .stock-name {
    flex: 1;
    font-size: 15px;
    color: #1f2937;
  }
  .stock-name.checked {
    text-decoration: line-through;
    color: #9ca3af;
  }
  .delete-btn {
    background: transparent;
    border: none;
    color: #ef4444;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    transition: background 0.15s;
  }
  .delete-btn:hover { background: #fee2e2; }
  .empty {
    padding: 40px 20px;
    text-align: center;
    color: #9ca3af;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="container">
    <header>
      <h1>주식 종목 리스트</h1>
      <p>관심 종목을 추가하고 관리하세요</p>
    </header>
    <div class="input-area">
      <input type="text" id="stockInput" placeholder="종목명 입력 (예: 삼성전자)" maxlength="40">
      <button id="addBtn">추가</button>
    </div>
    <div class="stats">
      <span id="totalCount">전체 0개</span>
      <span id="checkedCount">체크 0개</span>
    </div>
    <ul id="stockList"></ul>
  </div>

<script>
  const STORAGE_KEY = "stock-list-v1";
  const input = document.getElementById("stockInput");
  const addBtn = document.getElementById("addBtn");
  const list = document.getElementById("stockList");
  const totalCount = document.getElementById("totalCount");
  const checkedCount = document.getElementById("checkedCount");

  let stocks = loadStocks();

  function loadStocks() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }

  function saveStocks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(stocks));
  }

  function render() {
    list.innerHTML = "";
    if (stocks.length === 0) {
      const empty = document.createElement("li");
      empty.className = "empty";
      empty.textContent = "아직 추가된 종목이 없습니다.";
      list.appendChild(empty);
    } else {
      stocks.forEach(stock => {
        const li = document.createElement("li");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "checkbox";
        checkbox.checked = stock.checked;
        checkbox.addEventListener("change", () => toggleStock(stock.id));

        const name = document.createElement("span");
        name.className = "stock-name" + (stock.checked ? " checked" : "");
        name.textContent = stock.name;

        const delBtn = document.createElement("button");
        delBtn.className = "delete-btn";
        delBtn.textContent = "×";
        delBtn.title = "삭제";
        delBtn.addEventListener("click", () => deleteStock(stock.id));

        li.appendChild(checkbox);
        li.appendChild(name);
        li.appendChild(delBtn);
        list.appendChild(li);
      });
    }
    totalCount.textContent = `전체 ${stocks.length}개`;
    checkedCount.textContent = `체크 ${stocks.filter(s => s.checked).length}개`;
  }

  function addStock() {
    const name = input.value.trim();
    if (!name) return;
    stocks.unshift({
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name,
      checked: false,
    });
    input.value = "";
    saveStocks();
    render();
    input.focus();
  }

  function deleteStock(id) {
    stocks = stocks.filter(s => s.id !== id);
    saveStocks();
    render();
  }

  function toggleStock(id) {
    const stock = stocks.find(s => s.id === id);
    if (stock) {
      stock.checked = !stock.checked;
      saveStocks();
      render();
    }
  }

  addBtn.addEventListener("click", addStock);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") addStock();
  });

  render();
</script>
</body>
</html>
